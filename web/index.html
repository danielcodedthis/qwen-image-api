<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qwen Image</title>
<!-- Source: svgrepo.com (License: CC0 (Creative Commons Zero), by SVG Repo) -->
<link rel="icon" href="favicon.svg">
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
  textarea { width: 100%; height: 90px; padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #444; background: #1c1c1c; color: #eee; resize: vertical; }
  select, button { padding: 10px 16px; font-size: 15px; border-radius: 6px; border: 1px solid #444; margin-top: 10px; }
  button { background: #3b82f6; color: white; border: none; cursor: pointer; }
  button:disabled { background: #555; cursor: not-allowed; }
  #status { margin-top: 12px; color: #aaa; min-height: 20px; }
  #status.warn { color: #f59e0b; }
  #timing { margin-top: 6px; min-height: 20px; color: #9ca3af; }
  #timing.ok { color: #34d399; }
  #timing.err { color: #f87171; }
  #alerts { margin-top: 10px; }
  .alert { background: #3b1d1d; border: 1px solid #7f1d1d; color: #fca5a5; border-radius: 6px; padding: 8px 12px; margin-top: 6px; font-size: 14px; }
  img { max-width: 100%; margin-top: 16px; border-radius: 8px; display: block; }

  #stats { display: flex; gap: 16px; margin-top: 20px; }
  .stat-box { flex: 1; background: #1c1c1c; border: 1px solid #333; border-radius: 6px; padding: 10px 14px; }
  .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }
  .stat-value { font-size: 18px; margin-top: 4px; }
  .bar-track { background: #333; border-radius: 4px; height: 6px; margin-top: 6px; overflow: hidden; }
  .bar-fill { background: #3b82f6; height: 100%; transition: width 0.3s; }

  #logs { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-top: 12px;
          height: 160px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #9ca3af; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>Qwen Image Generator</h2>
  <textarea id="prompt" placeholder="a red fox sitting in a snowy forest..."></textarea>
  <br>
  <select id="size" disabled></select>
  <button id="go" disabled>Generate</button>
  <div id="status" class="warn">Waiting for the API to start (loading model)...</div>
  <div id="timing"></div>
  <div id="alerts"></div>
  <img id="result" style="display:none;">

  <div id="stats">
    <div class="stat-box">
      <div class="stat-label">VRAM</div>
      <div class="stat-value" id="vram-text">--</div>
      <div class="bar-track"><div class="bar-fill" id="vram-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">System RAM</div>
      <div class="stat-value" id="ram-text">--</div>
      <div class="bar-track"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Progress</div>
      <div class="stat-value" id="step-text">idle</div>
      <div class="bar-track"><div class="bar-fill" id="step-bar" style="width:0%"></div></div>
    </div>
  </div>

  <div id="logs"></div>

<script>
const API_BASE = "http://localhost:8000";
const goBtn = document.getElementById("go");
const statusEl = document.getElementById("status");
const img = document.getElementById("result");
const logsEl = document.getElementById("logs");
const timingEl = document.getElementById("timing");
const alertsEl = document.getElementById("alerts");

let apiReady = false;
let generating = false;
let sizesLoaded = false;

async function pollStatus() {
  try {
    const res = await fetch(API_BASE + "/status");
    if (!res.ok) throw new Error("not ok");
    const data = await res.json();

    if (apiReady && !data.model_loaded && !generating) {
      statusEl.classList.add("warn");
      statusEl.textContent = "Model not loaded — first Generate click will take a few minutes.";
    } else if (!generating) {
      statusEl.classList.remove("warn");
      statusEl.textContent = "";
    }

    if (!apiReady) {
      apiReady = true;
      statusEl.classList.remove("warn");
      statusEl.textContent = "";
    }
    goBtn.disabled = generating; // only generating (not readiness) controls this now

    alertsEl.innerHTML = "";
    (data.warnings || []).forEach(msg => {
      const div = document.createElement("div");
      div.className = "alert";
      div.textContent = "⚠ " + msg;
      alertsEl.appendChild(div);
    });

    if (!data.gpu.error) {
      const pct = (data.gpu.used_gb / data.gpu.total_gb) * 100;
      document.getElementById("vram-text").textContent = `${data.gpu.used_gb} / ${data.gpu.total_gb} GB`;
      document.getElementById("vram-bar").style.width = pct + "%";
    }
    if (!data.ram.error) {
      const pct = (data.ram.used_gb / data.ram.total_gb) * 100;
      document.getElementById("ram-text").textContent = `${data.ram.used_gb} / ${data.ram.total_gb} GB`;
      document.getElementById("ram-bar").style.width = pct + "%";
    }

    if (data.generating) {
      document.getElementById("step-text").textContent = `${data.step} / ${data.total_steps}`;
      document.getElementById("step-bar").style.width = (data.step / data.total_steps * 100) + "%";
    } else {
      document.getElementById("step-text").textContent = "idle";
      document.getElementById("step-bar").style.width = "0%";
    }

    logsEl.textContent = data.logs.join("\n");
    logsEl.scrollTop = logsEl.scrollHeight;
  } catch (err) {
    // Couldn't reach the API — either still starting up, or it just restarted.
    apiReady = false;
    goBtn.disabled = true;
    statusEl.classList.add("warn");
    statusEl.textContent = "Waiting for the API to start (loading model)...";
  }
}
setInterval(pollStatus, 1500);
pollStatus();

async function loadSizes() {
  if (sizesLoaded) return;
  try {
    const res = await fetch(API_BASE + "/config");
    if (!res.ok) throw new Error("not ok");
    const data = await res.json();
    const select = document.getElementById("size");
    select.innerHTML = "";
    data.available_sizes.forEach(size => {
      const [w, h] = size.split("x").map(Number);
      // if (w * h > data.max_pixels) return; // defensive, in case config drifts
      const opt = document.createElement("option");
      opt.value = size;
      opt.textContent = size;
      select.appendChild(opt);
    });
    select.disabled = false;
    sizesLoaded = true;
  } catch (err) {
    // API not ready yet — keep retrying
  }
}
setInterval(loadSizes, 3000);
loadSizes();

goBtn.addEventListener("click", async () => {
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) { timingEl.className = "err"; timingEl.textContent = "Enter a prompt first."; return; }

  const size = document.getElementById("size").value;
  generating = true;
  goBtn.disabled = true;
  img.style.display = "none";
  const start = Date.now();
  timingEl.className = "";
  const tick = () => { timingEl.textContent = `Generating... ${((Date.now() - start) / 1000).toFixed(0)}s elapsed`; };
  tick();
  const ticker = setInterval(tick, 1000);

  try {
    const res = await fetch(API_BASE + "/v1/images/generations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, size })
    });
    if (!res.ok) {
      const text = await res.text();
      let detail = text;
      try { detail = JSON.parse(text).detail || text; } catch (e) {}
      throw new Error(`${res.status}: ${detail}`);
    }
    const data = await res.json();
    img.src = "data:image/png;base64," + data.data[0].b64_json;
    img.style.display = "block";
    const secs = ((Date.now() - start) / 1000).toFixed(1);
    const genSecs = data.generation_seconds != null ? ` (server: ${data.generation_seconds}s)` : "";
    timingEl.className = "ok";
    timingEl.textContent = `Done in ${secs}s total${genSecs}.`;
  } catch (err) {
    const secs = ((Date.now() - start) / 1000).toFixed(1);
    timingEl.className = "err";
    timingEl.textContent = `Failed after ${secs}s — ${err.message}`;
  } finally {
    clearInterval(ticker);
    generating = false;
    goBtn.disabled = !apiReady;
  }
});
</script>
</body>
</html>
