# Qwen Image API configuration
#
# Edit this file and restart the container (docker compose restart qwen-image-api)
# to apply changes — no rebuild needed, since this file is volume-mounted, not
# copied into the image.

memory:
  # Run EVERYTHING from system RAM on the CPU (GPU is not used at all).
  run_on_ram: false

  # Int8 weight-only quantization of the transformer. Saves memory, 
  # but it can be slower than plain bf16; 
  quantize_transformer: false

  # VRAM budget for pipeline component placement (device_map="balanced"), set
  # at LOAD TIME. Components too large for this budget (the text encoder, in
  # our setup) get placed on CPU RAM permanently instead of GPU.
  #
  # This does NOT cap runtime memory during generation — that's controlled by
  # resolution (see max_pixels below) and is managed separately by PyTorch's
  # allocator. The relationship between the two: a LOWER value here frees more
  # of the physical 32GB card for the runtime activation spike during
  # denoising/decode, which is what large resolutions actually need. A higher
  # value keeps more weights GPU-resident (marginally faster) but leaves less
  # room for that spike.
  #
  # 16GiB is the current tested safe minimum value
  gpu_max_memory: "16GiB"

  # System RAM budget for whatever spills off the GPU.
  cpu_max_memory: "80GiB"

generation:
  # Denoising steps. Higher = better quality, slower. 40 is the diffusers
  # default for Qwen-Image-2.1.
  # 20 (default)
  # 15 (good and fast)
  # 10 (totally ok, minimum)
  total_steps: 20

  # True classifier-free guidance. Higher = follows the prompt (and the
  # negative prompt) more strongly. 1.0 = OFF (no negative prompt is used and
  # steps cost half as much). Anything above 1.0 runs the transformer twice
  # per step, so generation takes roughly 2x as long. 4.0 is the Qwen-Image
  # reference value.
  true_cfg_scale: 2.0

  # Default negative prompt, pre-filled in the web UI (the UI field can
  # override it per request). Only used when true_cfg_scale > 1.
  negative_prompt: "deformed hands, extra fingers, fused fingers, missing fingers, deformed feet, extra toes, bad anatomy, blurry, low quality"

  # Requests above this pixel count (width * height) are rejected with a
  # clean 400 error. 1638400 = 1280x1280, tested stable at gpu_max_memory:
  # 16GiB (see note above re: how close to the VRAM ceiling that actually
  # runs). If you raise gpu_max_memory back up for faster small-image
  # generation, re-test at this resolution before trusting it again — the two
  # settings interact.
  max_pixels: 1638400

ui:
  available_sizes:
    - "1024x1024"
    - "512x512"
    - "512x768"
    - "512x1024"
    - "768x768"
    - "768x1024"
    - "768x1280"
    - "1024x1280"
    - "1280x768"
    - "1280x1280"
    # 2359296
    - "1536x1536"

startup:
  # false: model loads immediately on container start — slower
  # startup, but every request is equally fast.
  # true: model stays unloaded until the first generation request arrives —
  # the container starts instantly and uses no GPU memory while idle, but the
  # first request after each startup pays the full load time before it even
  # begins generating.
  lazy_load: true

monitoring:
  # A memory warning is logged (and shown in the web UI) when usage crosses
  # these percentages. Warnings are logged once per crossing, not every step.
  vram_warn_percent: 92
  ram_warn_percent: 90

# Models you can switch between in the web UI. Switching unloads the current
# model and loads the other one (a few minutes). Per-model total_steps,
# true_cfg_scale and negative_prompt override the "generation" section.
#
# Download Turbo into ./models (the folder must contain model_index.json):
#   hf download Qwen/Qwen-Image-2.1-Turbo --local-dir ./models/Qwen-Image-2.1-Turbo
# Note: the Qwen Research License allows non-commercial research use only.
default_model: base
models:
  base:
    label: "Qwen-Image-2.1"
    path: /app/models/Qwen-Image-2.1
  turbo:
    enabled: false          # Turbo has its own container: qwen-image-turbo-api (config.turbo.yaml)
    label: "Qwen-Image-2.1 Turbo"
    path: /app/models/Qwen-Image-2.1-Turbo
    total_steps: 8
    true_cfg_scale: 1.0
