# Qwen-Image-2.1-Turbo API configuration (container: qwen-image-turbo-api)
#
# Mounted read-only at /app/config.yaml. After editing:
#   docker compose restart qwen-image-turbo-api
#
# This container serves ONLY the Turbo model. The Qwen Research License allows
# non-commercial research use only.

default_model: turbo

models:
  base:
    enabled: false          # not served from this container
  turbo:
    label: "Qwen-Image-2.1 Turbo"
    path: /app/models/Qwen-Image-2.1-Turbo
    # Turbo is distilled for 8 steps, and its sampling schedule is saved inside
    # the checkpoint (it only takes effect with a recent diffusers build). Keep
    # this at 8: other values are not what the model was trained for.
    total_steps: 8
    true_cfg_scale: 1.0     # no guidance; Turbo is meant to run at CFG 1

memory:
  # Run everything on the CPU from system RAM (very slow, see main config).
  run_on_ram: false
  # Plain bf16 gave you better results than int8 and fits (7B = ~14 GB).
  quantize_transformer: false
  # VRAM budget for placement at load time; the 8B text encoder goes to RAM.
  gpu_max_memory: "16GiB"
  cpu_max_memory: "80GiB"

generation:
  # Fallbacks only; the Turbo model entry above overrides steps and guidance.
  total_steps: 8
  true_cfg_scale: 1.0
  negative_prompt: ""
  # 1638400 = 1280x1280. Turbo's native class is ~2K (2048x2048 = 4194304), but
  # that needs far more memory; raise this gradually and watch peak VRAM in the log.
  max_pixels: 1638400

ui:
  available_sizes:
    - "512x512"
    - "768x768"
    - "1024x1024"
    - "768x1280"
    - "1024x1280"
    - "1280x768"
    - "1280x1280"

startup:
  # true: load on the first request, so the container uses no VRAM while idle
  # (important when the base container shares the same GPU).
  lazy_load: true

monitoring:
  vram_warn_percent: 92
  ram_warn_percent: 90
