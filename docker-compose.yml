services:
  qwen-image-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen-image-api
    user: "${UID}:${GID}"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./cache/miopen:/app/cache/miopen
      - ./output:/app/output
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=garbage_collection_threshold:0.6,max_split_size_mb:512
      # forces a full kernel search-and-compile on first run (slower first request) 
      # so it actually populates the cache instead of settling for a fast-but-unoptimized fallback. 
      # Once ./cache/miopen/gfx1201_32.ukdb exists and looks populated, 
      # remove that env var — leaving it set forces re-search every time, which defeats the purpose.
      # - MIOPEN_FIND_ENFORCE=3 
      - MIOPEN_USER_DB_PATH=/app/cache/miopen
      - MIOPEN_CACHE_DIR=/app/cache/miopen
    ipc: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      # getent group render | cut -d: -f3
      - "${RENDER_GID}"
    restart: "no"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: "8g"

  # Qwen-Image-2.1-Turbo only. Same server code (./server) as qwen-image-api,
  # but its own image (Dockerfile.turbo), its own config and its own output folder.
  # Both containers share one GPU: with lazy_load they use no VRAM while idle, but
  # avoid generating on both at the same time.
  qwen-image-turbo-api:
    build:
      context: .
      dockerfile: Dockerfile.turbo
    container_name: qwen-image-turbo-api
    user: "${UID}:${GID}"
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models
      - ./cache/miopen:/app/cache/miopen
      - ./output-turbo:/app/output
      - ./config.turbo.yaml:/app/config.yaml:ro
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=garbage_collection_threshold:0.6,max_split_size_mb:512
      - MIOPEN_USER_DB_PATH=/app/cache/miopen
      - MIOPEN_CACHE_DIR=/app/cache/miopen
    ipc: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID}"
    restart: "no"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: "8g"

  qwen-image-ui:
    image: nginx:alpine
    container_name: qwen-image-ui
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - qwen-image-api
    restart: "no"

  # Same web files as above; opened on :3001 it automatically talks to the Turbo API (:8001).
  qwen-image-turbo-ui:
    image: nginx:alpine
    container_name: qwen-image-turbo-ui
    ports:
      - "3001:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - qwen-image-turbo-api
    restart: "no"
